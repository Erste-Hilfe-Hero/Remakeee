// Versions come from the Godot Android build template (android/build/config.gradle), so the
// plugin always matches the engine it is exported with.
buildscript {
    apply from: rootProject.file('../../../android/build/config.gradle')
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${versions.androidGradlePlugin}"
    }
}

apply plugin: 'com.android.library'

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'de.chimora.appupdate'
    compileSdk versions.compileSdk
    defaultConfig {
        minSdk versions.minSdk
    }
    compileOptions {
        sourceCompatibility versions.javaVersion
        targetCompatibility versions.javaVersion
    }
}

dependencies {
    // Same version as APP_UPDATE in addons/chimora_appupdate/plugin.gd (tools/build_appupdate_plugin.sh).
    implementation "com.google.android.play:app-update:${project.findProperty('appUpdateVersion') ?: '2.1.0'}"
    compileOnly "org.godotengine:godot:${project.findProperty('godotVersion') ?: '4.7.2.stable'}"
}
