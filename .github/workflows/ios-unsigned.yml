# iOS without paid macOS minutes (Ali 2026-11-08: "Nutz den neuen kostenfreien Weg für iOS").
# Remakeee is public, so GitHub's macOS runners cost nothing here. This job uses no secret: it compiles the game
# UNSIGNED and publishes the .app to the public release "ios-unsigned". The lifekit repo's Contabo runner
# (run:chimora-store-ios) then signs it with rcodesign and uploads it through the App Store Connect API.
# Starts on a push whose commit message contains [ios-build], or by hand.
name: iOS unsigned build
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-unsigned
  cancel-in-progress: false
env:
  GODOT_VERSION: "4.7.2"
  GODOT_TEMPLATES: "4.7.2.stable"
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios-build]')
    # Xcode 27.2 (iOS SDK 27.2) on GitHub's free "xcode-27" image (Ali 2026-11-25: Chimora on Xcode 27 after
    # Two at the Table). The lifekit signing step refuses an app whose DTXcode is not 27*.
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Xcode 27.2
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 27\."
      - name: Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          tdir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATES}"
          mkdir -p "$tdir"
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz "templates/ios.zip" "templates/version.txt" -d "$tdir"
      - name: Server address (Chimora is online only)
        env:
          CHIMORA_SERVER: https://chimora.161-97-102-171.sslip.io
        run: tools/online/write_config.sh --require
      - name: StoreKit 2 plugin (App Store purchases)
        run: tools/build_storekit_plugin.sh
      - name: Export the Xcode project
        run: |
          GODOT=~/godot/Godot.app/Contents/MacOS/Godot
          # Build number: same scheme as before (yyddd HHMM / 10), always higher than the last upload.
          code=$(date -u +%y%j%H%M | sed 's/^0*//'); code=$((code / 10))
          echo "BUILD_NUMBER=$code" >> "$GITHUB_ENV"
          # Team ID is only needed for signing, which happens later on the Contabo host with the real profile.
          sed -i '' 's/^application\/app_store_team_id=.*/application\/app_store_team_id="CHIMORA000"/' export_presets.cfg
          sed -i '' 's/^application\/export_project_only=.*/application\/export_project_only=true/' export_presets.cfg
          perl -pi -e 's/^application\/version=.*/application\/version="'$code'"/' export_presets.cfg
          perl -pi -e 's/^const CLIENT_VERSION: int = .*/const CLIENT_VERSION: int = '$code'/' scripts/online/Online.gd
          mkdir -p build/ios
          "$GODOT" --headless --path . --import > /dev/null 2>&1 || true
          "$GODOT" --headless --path . --export-release "iOS" build/ios/Chimora.ipa 2>&1 | tail -40
          ls -la build/ios
          test -d build/ios/Chimora.xcodeproj
      - name: Compile unsigned (Release, device)
        run: |
          xcodebuild -project build/ios/Chimora.xcodeproj -scheme Chimora -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Chimora.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | grep -E "error|warning: .*(minos|deployment)|ARCHIVE|BUILD" | tail -40
          APP=$(ls -d "$RUNNER_TEMP"/Chimora.xcarchive/Products/Applications/*.app | head -1)
          test -d "$APP"
          for pl in "$APP/Info.plist" "$APP"/Frameworks/*.framework/Info.plist; do
            echo "$pl: MinimumOSVersion $(plutil -extract MinimumOSVersion raw "$pl" 2>/dev/null || echo none)"
          done
          # Update 1.3.2 (adaptive screens): the iPad allows every orientation (Split View, Stage
          # Manager); the game keeps an iPhone upright itself (ScreenFit.apply_orientation).
          echo "iPhone: $(plutil -extract UISupportedInterfaceOrientations json -o - "$APP/Info.plist")"
          o=$(plutil -extract "UISupportedInterfaceOrientations~ipad" json -o - "$APP/Info.plist")
          echo "iPad: $o"
          for want in Portrait PortraitUpsideDown LandscapeLeft LandscapeRight; do
            echo "$o" | grep -q "\"UIInterfaceOrientation$want\"" || { echo "::error::the iPad orientations lack $want"; exit 1; }
          done
          echo "UIRequiresFullScreen: $(plutil -extract UIRequiresFullScreen raw "$APP/Info.plist" 2>/dev/null || echo unset)"
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist"
          plutil -extract CFBundleVersion raw "$APP/Info.plist"
          # strip any ad-hoc signature, the host signs everything again
          find "$APP" -name _CodeSignature -type d -prune -exec rm -rf {} +
          rm -f "$APP/embedded.mobileprovision"
          (cd "$(dirname "$APP")" && tar -czf "$RUNNER_TEMP/Chimora-unsigned.tar.gz" "$(basename "$APP")")
          ls -l "$RUNNER_TEMP/Chimora-unsigned.tar.gz"
          printf 'commit=%s\nbuild=%s\nref=%s\n' "$GITHUB_SHA" "$BUILD_NUMBER" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/Chimora-unsigned.txt"
      - name: Publish to the ios-unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP"
          gh release view ios-unsigned >/dev/null 2>&1 || gh release create ios-unsigned --prerelease \
            --title "iOS unsigned build" --notes "Unsigned .app for the signing step on the build host."
          gh release edit ios-unsigned --notes "Unsigned .app, commit $GITHUB_SHA, build $BUILD_NUMBER, ref $GITHUB_REF_NAME."
          for i in 1 2 3; do
            gh release upload ios-unsigned Chimora-unsigned.tar.gz Chimora-unsigned.txt --clobber && break
            sleep $((i * 10))
          done
      # Apple pre-check rule (owner 2026-11-22): the app must really start before any submission. Same exported
      # device app, retagged for the simulator, launched on an iPhone simulator, screenshots kept as artifact. Does not
      # block the device build above.
      - name: Simulator start check
        continue-on-error: true
        run: |
          # iOS 27 simulators run arm64 only, and Godot's simulator library is x86_64 only. So the shipped arm64
          # device app itself is retagged for the simulator platform (vtool, platform 7) and ad-hoc signed: the
          # check runs the same binary that goes to the App Store.
          SRC=$(ls -d "$RUNNER_TEMP"/Chimora.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/simapp" && cp -R "$SRC" "$RUNNER_TEMP/simapp/"
          APP="$RUNNER_TEMP/simapp/$(basename "$SRC")"
          SDKV=$(xcrun --sdk iphonesimulator --show-sdk-version)
          find "$APP" -type f | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              xcrun vtool -arch arm64 -set-build-version 7 16.0 "$SDKV" -replace -output "$f.sim" "$f" && mv "$f.sim" "$f"
            fi
          done
          for fw in "$APP"/Frameworks/*.framework; do [ -d "$fw" ] && codesign -f -s - "$fw"; done
          codesign -f -s - "$APP"
          xcrun vtool -show-build "$APP/$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")" | head -8
          # iPhone Duo first (foldable, two displays), else the newest iPhone.
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];a=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")];duo=[x for x in a if "Duo" in x["name"]];print((duo or a)[-1]["udid"])')
          xcrun simctl list devices available | grep -i "$DEV"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          xcrun simctl launch "$DEV" "$BID"
          mkdir -p "$RUNNER_TEMP/simshots"
          # iOS 27 simulators can take ~35 s for the first frame.
          for t in 15 35 60 90; do
            sleep $((t - ${prev:-0})); prev=$t
            # The iPhone Duo has two displays (ids 1 and 3); a plain screenshot then refuses to choose.
            xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/simshots/sim_${t}s.png" 2>/dev/null || true
            for n in 0 1 2 3; do xcrun simctl io "$DEV" screenshot --display=$n "$RUNNER_TEMP/simshots/sim_${t}s_display$n.png" 2>/dev/null || true; done
          done
          xcrun simctl spawn "$DEV" launchctl list | grep -i "$BID" && echo "SIM: app still running after 90 s" || echo "::error::SIM: app not running after 90 s"
          xcrun simctl spawn "$DEV" log show --last 2m --predicate "process CONTAINS[c] 'Chimora'" 2>/dev/null | tail -60 > "$RUNNER_TEMP/simshots/log.txt" || true
          printf 'commit=%s\nbuild=%s\n' "$GITHUB_SHA" "$BUILD_NUMBER" > "$RUNNER_TEMP/simshots/info.txt"
      - name: Keep simulator screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-sim-shots
          path: ${{ runner.temp }}/simshots/
          if-no-files-found: ignore
