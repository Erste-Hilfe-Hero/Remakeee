name: Export
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable || true
      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/chimora.apk || echo "Add export_presets.cfg + keystore secrets first"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: build/android }
