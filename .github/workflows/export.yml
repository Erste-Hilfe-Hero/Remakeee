name: CI and export

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build the iOS IPA (needs the iOS signing secrets)"
        type: boolean
        default: false
      play_internal:
        description: "Upload the release AAB to the Google Play internal testing track"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TEMPLATES: "4.7.2.stable"
  BUNDLETOOL_VERSION: "1.18.1"

# One run per branch; a newer push to a pull request cancels the older run (plan item 3739).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Banned-term scan and asset provenance (docs/IP_HYGIENE.md).
  ip-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: tools/ip_check.sh
      - name: Commit messages and PR title (AGENTS.md, plan item 3955)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: tools/ip_check.sh --messages "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Every player-facing text has a German translation
        run: python3 tools/i18n/build.py --check && python3 tools/i18n_extract.py de --check
      - name: The other 12 languages keep their placeholders (coverage is only reported)
        run: python3 tools/i18n/check_lang.py
      - name: Version name and code agree everywhere (tools/bump_version.py)
        run: python3 tools/bump_version.py --check
      - name: A save version bump brings a fixture and a migration test
        run: python3 tools/save_version_check.py
      - name: Store web pages match docs/legal
        run: python3 tools/site/build_site.py --check
      - name: Server copy of the shop offers and store/products.json match data/shop.json
        run: python3 tools/shop/build_offers_sql.py --check
      - name: Store products are valid for the Play Console (tools/store/push_products.py)
        run: python3 tools/store/push_products.py --check && python3 -m unittest discover -s tools/store/tests
      - name: Store listing material (texts, screenshots, icons, presets)
        run: pip install --quiet pillow && python3 tools/release_check.py

  # Server functions (supabase/migrations) on a throwaway Postgres, with their tests.
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: PostgreSQL server binaries
        run: ls /usr/lib/postgresql/*/bin/initdb || (sudo apt-get update && sudo apt-get install -y postgresql)
      # The billing service (server/billing) needs the cryptography package, also for its database check.
      - name: Billing service tests
        run: |
          python3 -m pip install -q --user --break-system-packages -r server/billing/requirements.txt
          python3 -m unittest discover -s server/billing/tests -v
      - run: tools/online/test_sql.sh

  # Headless boot, data validation and GUT tests on every push and PR.
  test:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Import project
        run: godot --headless --path . --import
      - name: Headless boot must print no errors
        run: tools/headless_check.sh godot
      - name: Validate data
        run: godot --headless --path . -s res://tools/validate_data.gd
      - name: GUT tests
        run: godot --headless --path . -s res://addons/gut/gut_cmdln.gd

  # Installable test APK on every push and PR: download the "android-debug-apk"
  # artifact and install it on the phone. Signed with a throwaway debug keystore
  # made in the job, so no secrets are needed.
  android-debug:
    needs: test
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Godot templates and Android build template
        run: tools/ci_setup_android.sh
      # Google Play Billing plugin (plan area 10): built for exactly this engine version.
      - name: Build billing plugin
        run: tools/build_billing_plugin.sh
      - name: Create throwaway debug keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Server address (optional for test builds)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHIMORA_SERVER: ${{ secrets.CHIMORA_SERVER || 'https://chimora.161-97-102-171.sslip.io' }}
        run: tools/online/write_config.sh
      - name: Export debug APK
        env:
          # Set all three debug variables (setting only some breaks exports, Godot #109551).
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --path . --import
          godot --headless --path . --export-debug "Android APK (debug)" build/android/Chimora-debug.apk
          "$(tools/find_zipalign.sh)" -c -P 16 -v 4 build/android/Chimora-debug.apk
      - name: Billing plugin is in the APK
        run: unzip -p build/android/Chimora-debug.apk 'classes*.dex' | grep -a -q 'de/chimora/billing/ChimoraBilling'
      - name: APK size budget
        run: tools/apk_budget.sh build/android/Chimora-debug.apk 92
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-apk
          path: build/android/Chimora-debug.apk

  # Browser test build (single-threaded, no special headers needed). Served by the game server at /play/.
  web:
    needs: test
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Export templates into HOME
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          [ -d "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATES" ] || \
            cp -r "/root/.local/share/godot/export_templates/$GODOT_TEMPLATES" "$HOME/.local/share/godot/export_templates/"
      - name: Server address
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHIMORA_SERVER: ${{ secrets.CHIMORA_SERVER || 'https://chimora.161-97-102-171.sslip.io' }}
        run: tools/online/write_config.sh
      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --import
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -s build/web/index.wasm
          cd build/web && zip -qr ../chimora-web.zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-build
          path: build/chimora-web.zip

  # Puts the latest test APK at a fixed public link that opens on a phone:
  # https://github.com/Erste-Hilfe-Hero/Remakeee/releases/download/online-test/Chimora-online-test.apk
  apk-link:
    needs: [android-debug, web]
    # Only the integration branch (and main) publish the test build; feature PRs into it would
    # otherwise overwrite it with their own unmerged state.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.head_ref == 'claude/project-thread-lhphga-c' || github.ref_name == 'claude/project-thread-lhphga-c' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    # Runs from several PRs upload to the same release; one at a time, or --clobber races (HTTP 422).
    concurrency:
      group: online-test-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-debug-apk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-build
      - name: Upload to the online-test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv Chimora-debug.apk Chimora-online-test.apk
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          gh release view online-test >/dev/null 2>&1 || gh release create online-test --prerelease \
            --target "$sha" --title "Chimora online test" --notes "Latest test build (debug APK, real server)."
          gh release edit online-test --notes "Latest test build (debug APK, real server). Commit $sha, ref ${{ github.head_ref || github.ref_name }}."
          # GitHub's upload endpoint sometimes times out (HTTP 408); try again.
          for i in 1 2 3; do
            gh release upload online-test Chimora-online-test.apk chimora-web.zip --clobber && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 15))
          done

  # Signed release AAB for Google Play. Runs on version tags or manual runs.
  # Secrets live in the protected "prod" environment:
  #   ANDROID_KEYSTORE_B64      base64 of the upload keystore (Play App Signing holds the app key)
  #   ANDROID_KEYSTORE_ALIAS    key alias
  #   ANDROID_KEYSTORE_PASSWORD keystore and key password
  android-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Godot templates and Android build template
        run: tools/ci_setup_android.sh
      # Google Play Billing plugin (plan area 10): built for exactly this engine version.
      - name: Build billing plugin
        run: tools/build_billing_plugin.sh
      - name: Stamp version code (Play needs a higher code for every upload)
        run: |
          code=$((1000 + ${{ github.run_number }}))
          sed -i "s/^version\/code=.*/version\/code=${code}/" export_presets.cfg
          sed -i "s/^const CLIENT_VERSION: int = .*/const CLIENT_VERSION: int = ${code}/" scripts/online/Online.gd
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            sed -i "s/^version\/name=.*/version\/name=\"${name}\"/" export_presets.cfg
          fi
          grep -E "^version/(code|name)=" export_presets.cfg
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set in the prod environment"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Server address (Chimora is online only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHIMORA_SERVER: ${{ secrets.CHIMORA_SERVER || 'https://chimora.161-97-102-171.sslip.io' }}
        run: tools/online/write_config.sh --require
      - name: Export release AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Deliberately no GODOT_ANDROID_KEYSTORE_DEBUG_* here (Godot #109551).
        run: |
          mkdir -p build/android
          godot --headless --path . --import
          godot --headless --path . --export-release "Android" build/android/Chimora.aab
      - name: Check 16 KB alignment of native libraries
        run: |
          command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3)
          python3 tools/check_16kb.py build/android/Chimora.aab
      - name: zipalign -c -P 16 on a universal APK built from the AAB
        env:
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          wget -q -O "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle=build/android/Chimora.aab --output="$RUNNER_TEMP/universal.apks" \
            --ks="$RUNNER_TEMP/upload.keystore" --ks-key-alias="$KS_ALIAS" \
            --ks-pass="pass:$KS_PASS" --key-pass="pass:$KS_PASS"
          unzip -o -q "$RUNNER_TEMP/universal.apks" universal.apk -d "$RUNNER_TEMP"
          "$(tools/find_zipalign.sh)" -c -P 16 -v 4 "$RUNNER_TEMP/universal.apk"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-aab
          path: build/android/Chimora.aab

  # Google Play internal testing. Runs only when started by hand with play_internal ticked.
  # Needs PLAY_SERVICE_ACCOUNT_JSON (a Play Console service account with release rights)
  # in the prod environment, and the app must already exist in Play Console (first upload by hand).
  android-internal:
    needs: android-release
    if: github.event_name == 'workflow_dispatch' && inputs.play_internal
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-aab
          path: build/android
      - name: Upload to the internal testing track
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.chimora.game
          releaseFiles: build/android/Chimora.aab
          track: internal
          status: draft

  # iOS IPA + TestFlight upload. Stub until the Apple signing secrets exist.
  # The godot-ci container cannot build iOS, so this runs on a macOS runner with Xcode 26.
  # Secrets ("prod" environment):
  #   IOS_DIST_CERT_P12_B64, IOS_DIST_CERT_PASSWORD   Apple Distribution certificate
  #   IOS_PROVISION_PROFILE_B64                       App Store provisioning profile
  #   IOS_TEAM_ID                                     Apple team ID
  #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64       App Store Connect API key (upload)
  ios:
    needs: test
    if: (github.event_name == 'workflow_dispatch' && inputs.ios) || (startsWith(github.ref, 'refs/tags/v') && vars.IOS_ENABLED == 'true')
    runs-on: macos-26
    environment: prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Cache Godot editor and templates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_TEMPLATES }}
          key: godot-macos-${{ env.GODOT_VERSION }}
      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -x ~/godot/Godot.app/Contents/MacOS/Godot ]; then
            mkdir -p ~/godot
            curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
            unzip -q /tmp/godot.zip -d ~/godot
          fi
          tdir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATES}"
          if [ ! -f "$tdir/ios.zip" ]; then
            mkdir -p "$tdir"
            curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q -j /tmp/templates.tpz "templates/*" -d "$tdir"
          fi
      - name: Import signing certificate and provisioning profile
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_B64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/dist.p12"
      - name: Server address (Chimora is online only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHIMORA_SERVER: ${{ secrets.CHIMORA_SERVER || 'https://chimora.161-97-102-171.sslip.io' }}
        run: tools/online/write_config.sh --require
      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          GODOT=~/godot/Godot.app/Contents/MacOS/Godot
          # Team ID and profile UUID are not secret, but they are account-specific, so they are filled in here.
          sed -i '' "s/^application\/app_store_team_id=.*/application\/app_store_team_id=\"$IOS_TEAM_ID\"/" export_presets.cfg
          perl -0pi -e 's/(\[preset\.1\.options\]\n)/$1application\/provisioning_profile_uuid_release="$ENV{IOS_PROFILE_UUID}"\n/' export_presets.cfg
          # TestFlight needs a higher build number for every upload.
          perl -pi -e 's/^application\/version=.*/application\/version="'$((1000 + ${{ github.run_number }}))'"/' export_presets.cfg
          perl -pi -e 's/^const CLIENT_VERSION: int = .*/const CLIENT_VERSION: int = '$((1000 + ${{ github.run_number }}))'/' scripts/online/Online.gd
          mkdir -p build/ios
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --export-release "iOS" build/ios/Chimora.ipa
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios --file build/ios/Chimora.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP/profile.mobileprovision"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ipa
          path: build/ios/Chimora.ipa
