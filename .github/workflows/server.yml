name: Game server

on:
  pull_request:
    paths: ["server/**", "supabase/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", "supabase/**"]
  workflow_dispatch:
    inputs:
      domain:
        description: "Own domain for the server (empty = <ip>.sslip.io)"
        type: string
        default: ""

# One run per branch; a newer push to a pull request cancels the older run (plan item 3739).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Starts the whole server on the runner and plays a short session against it.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start server
        run: LOCAL_TEST=1 bash server/setup.sh
      - name: Run setup again (updates must keep data and keys)
        run: LOCAL_TEST=1 bash server/setup.sh
      - name: Smoke test
        run: bash server/smoke_test.sh
      - name: Backup
        run: bash server/backup.sh && ls -la server/backups
      - name: Daily deletion run works against the real GoTrue tables
        run: bash server/cleanup.sh
      - name: Logs
        if: failure()
        run: cd server && docker compose logs --tail 80

  # Same, but next to another Caddy that already owns ports 80/443 (like the shared Contabo host):
  # Chimora must add only its own site block and leave the other site working.
  shared-host:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start a stand-in for the existing proxy (loaded certificate, pinned TLS policies, drifted live config)
        run: |
          mkdir -p "$RUNNER_TEMP/proxy" "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=other.localhost" \
            -addext "subjectAltName=DNS:other.localhost" \
            -keyout "$RUNNER_TEMP/certs/other.key" -out "$RUNNER_TEMP/certs/other.crt" 2>/dev/null
          chmod a+r "$RUNNER_TEMP/certs/"*
          cat > "$RUNNER_TEMP/proxy/Caddyfile" <<'EOF'
          {
              auto_https disable_redirects
          }
          https://other.localhost {
              tls /certs/other.crt /certs/other.key
              respond "other https"
          }
          :80 {
              respond "other site"
          }
          EOF
          docker network create otherprod
          docker run -d --name other-proxy --network otherprod -p 8080:80 -p 8443:443 \
            -v "$RUNNER_TEMP/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$RUNNER_TEMP/certs:/certs:ro" caddy:2.10.2
          for i in $(seq 1 20); do curl -fsS http://localhost:8080 && break; sleep 1; done
          # Like production: the running config has a route the file does not know about.
          docker exec other-proxy wget -qO- http://127.0.0.1:2019/config/ > "$RUNNER_TEMP/live.json"
          python3 - "$RUNNER_TEMP/live.json" <<'PY'
          import json, sys
          cfg = json.load(open(sys.argv[1]))
          srv = next(s for s in cfg["apps"]["http"]["servers"].values() if ":443" in s["listen"])
          srv["routes"].insert(0, {"match": [{"host": ["other.localhost"], "path": ["/drift"]}],
                                   "handle": [{"handler": "static_response", "body": "drift"}], "terminal": True})
          srv.setdefault("tls_connection_policies", [{"match": {"sni": ["other.localhost"]}}])
          json.dump(cfg, open(sys.argv[1], "w"))
          PY
          docker exec -i other-proxy sh -c 'cat > /tmp/live.json' < "$RUNNER_TEMP/live.json"
          docker exec other-proxy caddy reload --config /tmp/live.json
          cp "$RUNNER_TEMP/proxy/Caddyfile" "$RUNNER_TEMP/Caddyfile.orig"
          curl -fsSk --resolve other.localhost:8443:127.0.0.1 https://other.localhost:8443/drift
      - name: Install Chimora in shared mode
        run: |
          sudo SHARED_HOST=1 SHARED_NETWORK=otherprod PROXY_CONTAINER=other-proxy \
            PROXY_CADDYFILE="$RUNNER_TEMP/proxy/Caddyfile" DOMAIN=localhost bash server/setup.sh
      - name: Run it again (nothing is added twice)
        run: |
          sudo SHARED_HOST=1 SHARED_NETWORK=otherprod PROXY_CONTAINER=other-proxy \
            PROXY_CADDYFILE="$RUNNER_TEMP/proxy/Caddyfile" DOMAIN=localhost bash server/setup.sh | tee "$RUNNER_TEMP/second.log"
          grep -q "Nothing to do" "$RUNNER_TEMP/second.log"
          grep -q "already has the localhost block" "$RUNNER_TEMP/second.log"
          test "$(grep -c chimora-begin "$RUNNER_TEMP/proxy/Caddyfile")" = 1
          cat "$RUNNER_TEMP/proxy/Caddyfile"
          # Everything outside the chimora block is unchanged.
          sed '/# chimora-begin/,/# chimora-end/d' "$RUNNER_TEMP/proxy/Caddyfile" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/stripped"
          diff <(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$RUNNER_TEMP/Caddyfile.orig") "$RUNNER_TEMP/stripped"
          docker exec other-proxy wget -qO- http://127.0.0.1:2019/config/ | python3 -c '
          import json, sys
          cfg = json.load(sys.stdin)
          srv = next(s for s in cfg["apps"]["http"]["servers"].values() if ":443" in s["listen"])
          assert sum(r.get("match") == [{"host": ["localhost"]}] for r in srv["routes"]) == 1
          assert sum(p.get("match") == {"sni": ["localhost"]} for p in srv["tls_connection_policies"]) == 1'
      - name: Other sites untouched, Chimora works through the proxy
        run: |
          test "$(curl -fsS http://localhost:8080)" = "other site"
          test "$(curl -fsSk --resolve other.localhost:8443:127.0.0.1 https://other.localhost:8443/)" = "other https"
          test "$(curl -fsSk --resolve other.localhost:8443:127.0.0.1 https://other.localhost:8443/drift)" = "drift"
          sudo chmod -R a+r server/public
          for i in $(seq 1 20); do curl -fsSk https://localhost:8443/chimora.json && break; sleep 2; done
          SMOKE_INSECURE=1 bash server/smoke_test.sh https://localhost:8443
          ! sudo docker ps --format '{{.Names}} {{.Ports}}' | grep chimora- | grep -q -- '->'
          test -f /etc/cron.d/chimora-proxy
      - name: The other service reloads its own file (like a Nyrathen deploy); Chimora keeps working
        run: |
          docker exec other-proxy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          sleep 2
          test "$(curl -fsS http://localhost:8080)" = "other site"
          test "$(curl -fsSk --resolve other.localhost:8443:127.0.0.1 https://other.localhost:8443/)" = "other https"
          echo | openssl s_client -connect 127.0.0.1:8443 -servername other.localhost 2>/dev/null | openssl x509 -noout -subject | grep -q "CN *= *other.localhost"
          echo | openssl s_client -connect 127.0.0.1:8443 -servername localhost 2>/dev/null | openssl x509 -noout -ext subjectAltName | grep -q "DNS:localhost"
          SMOKE_INSECURE=1 bash server/smoke_test.sh https://localhost:8443
      - name: Logs
        if: failure()
        run: |
          docker logs --tail 60 other-proxy
          cd server && sudo docker compose logs --tail 60

  # Installs or updates the server on the VPS (Contabo). Needs the secrets CHIMORA_SERVER_IP and
  # CHIMORA_SERVER_PASSWORD (root password from Contabo's email). Skipped while they are missing.
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IP: ${{ secrets.CHIMORA_SERVER_IP }}
      SSHPASS: ${{ secrets.CHIMORA_SERVER_PASSWORD }}
      DOMAIN: ${{ inputs.domain }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check secrets
        id: have
        run: |
          if [ -z "$IP" ] || [ -z "$SSHPASS" ]; then
            echo "::notice::CHIMORA_SERVER_IP / CHIMORA_SERVER_PASSWORD not set, nothing to deploy (docs/ONLINE.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Copy files
        if: steps.have.outputs.go == 'true'
        run: |
          sudo apt-get install -yq sshpass >/dev/null
          opts="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          sshpass -e ssh $opts root@"$IP" "mkdir -p /opt/chimora/server /opt/chimora/supabase/migrations"
          sshpass -e rsync -az --delete -e "ssh $opts" --exclude .env --exclude public --exclude backups \
            server/ root@"$IP":/opt/chimora/server/
          sshpass -e rsync -az --delete -e "ssh $opts" supabase/migrations/ root@"$IP":/opt/chimora/supabase/migrations/
      - name: Install or update
        if: steps.have.outputs.go == 'true'
        run: |
          opts="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          sshpass -e ssh $opts root@"$IP" "DOMAIN='$DOMAIN' bash /opt/chimora/server/setup.sh"
      - name: Check it answers
        if: steps.have.outputs.go == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${IP//./-}.sslip.io/chimora.json" || { [ -n "$DOMAIN" ] && curl -fsS "https://$DOMAIN/chimora.json"; }; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Server does not answer over HTTPS yet."
          exit 1
