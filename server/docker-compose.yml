# Chimora game server: Postgres + sign-in (GoTrue) + database API (PostgREST) behind Caddy (HTTPS).
# The same programs as Supabase, so the game talks to it exactly like to a Supabase project.
# Started by server/setup.sh, which also writes .env. Nothing but Caddy is reachable from outside.
name: chimora

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      # Chimora has no email or phone login: only accounts without personal data.
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # New accounts per hour and IP address (plan item 3873; stock Caddy has no rate limiter).
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: 10

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # Feature switches from server_config (supabase/migrations/20261110090001_tech_sync.sql).
      PGRST_DB_PRE_REQUEST: public._pre_request

  # Battle referee (plan area 7, items 2687-2690, 2703): plays uploaded battles again with the
  # game's own battle code. No port; it only talks to the database, as user chimora_referee.
  # Started by setup.sh when the game project is next to server/ (profile "referee").
  referee:
    build:
      context: ..
      dockerfile: server/referee/Dockerfile
    restart: unless-stopped
    profiles: ["referee"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: chimora_referee
      PGPASSWORD: ${REFEREE_DB_PASSWORD}
      PGDATABASE: postgres

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on: [auth, rest]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
      - ./site:/srv/site:ro
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
